name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test (Windows, PowerShell 7)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Sort-Object Severity, ScriptName, Line | Format-Table Severity, RuleName, ScriptName, Line, Message -AutoSize -Wrap
          $errors = @($results | Where-Object { $_.Severity -in 'Error', 'ParseError' })
          if ($errors.Count -gt 0) { throw "PSScriptAnalyzer found $($errors.Count) error(s)." }

      - name: Pester
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'testResults.xml'
          Invoke-Pester -Configuration $config

      - name: Smoke test (module import, wimlib, DISM module, tweak catalog)
        shell: pwsh
        run: |
          ./Bin/x64/wimlib-imagex.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'wimlib-imagex.exe does not start.' }
          Import-Module ./MSMGToolkit/MSMGToolkit.psd1 -Force
          Get-TkDebugInfo | Format-Table -HideTableHeaders -Wrap
          (Get-Command -Module MSMGToolkit).Count
          Import-Module Dism -ErrorAction Stop
          Get-TkTweak -Build 26200 | Select-Object Id, Name | Format-Table -AutoSize
          New-TkUnattendXml -Architecture amd64 | Out-Null
          Get-TkOscdimgPath
